name: CI

on:
  push:
    branches: [main]
  pull_request:

# A push that supersedes another cancels it: the older answer is worthless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Types, lint and a real build. Catches the class of mistake that reaches
  # production as a blank page.
  build:
    runs-on: ubuntu-latest
    # /sitemap.xml queries the database at build time (Next prerenders it
    # up front since it's revalidated on a schedule, not per-request), so
    # this job needs a real, schema-loaded database like schema/journeys do.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
        ports: ["5432:5432"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Create the schema
        run: psql "$DATABASE_URL" -f src/lib/schema.sql
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      # The build comes first because it generates the route types (`RouteContext`)
      # that the API handlers are typed against: on a clean checkout there is no
      # .next, and tsc alone can't see them. Found by this job's first run.
      - run: npm run build
        env:
          SESSION_SECRET: ci-build-only
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
          DATABASE_SSL: "off"
      - run: npx tsc --noEmit
      - run: npm run lint -- --max-warnings 5
      # Advisory only: a CVE landing in a transitive dep must never fail an
      # unrelated PR at 2am. `--omit=dev` skips advisories in tooling
      # (Playwright, eslint…) that never ships to production.
      - run: npm audit --omit=dev || true

  # schema.sql and the migrations must describe the same database. Drift here
  # means a deploy meeting a column that isn't there.
  schema:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
        ports: ["5432:5432"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/check-schema.mjs
        env:
          ADMIN_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres

  # The journeys, driven in a real browser against a real build and a real
  # database. No camptocamp here: their outage must not block a merge.
  journeys:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cragdiary
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
        ports: ["5432:5432"]
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/cragdiary
      DATABASE_SSL: "off"
      SESSION_SECRET: ci-journeys-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Create the schema
        run: psql "$DATABASE_URL" -f src/lib/schema.sql
      - run: npm run build
      - name: Start the app
        run: |
          npx next start -p 3111 &
          npx wait-on http://localhost:3111/login --timeout 60000
      - name: Follow requests and follower removal
        run: node scripts/follow-check.mjs http://localhost:3111
      # The one test about something being impossible rather than working.
      - name: Nothing private leaks
        run: node scripts/privacy-check.mjs http://localhost:3111 "$DATABASE_URL"

  # Everything that leans on an API we don't control — camptocamp, and
  # Overpass for the gyms layer. Same checks, but their outage is their
  # problem: reported, never blocking.
  camptocamp:
    runs-on: ubuntu-latest
    continue-on-error: true
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cragdiary
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
        ports: ["5432:5432"]
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/cragdiary
      DATABASE_SSL: "off"
      SESSION_SECRET: ci-c2c-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: psql "$DATABASE_URL" -f src/lib/schema.sql
      - run: npm run build
      - name: Start the app
        run: |
          npx next start -p 3111 &
          npx wait-on http://localhost:3111/login --timeout 60000
      - name: Importing an outing brings its photos
        run: node scripts/c2c-import-check.mjs http://localhost:3111 "$DATABASE_URL"
      - name: The Cragseeker hover card stays inside the map
        run: node scripts/seeker-tip-check.mjs http://localhost:3111 /tmp
      - name: The gyms layer toggles, fetches once, and clears
        run: node scripts/seeker-gyms-check.mjs http://localhost:3111 /tmp
      # The pin moves on a held press and on a drag, and on nothing else —
      # a pan, a double-click zoom and a near-miss on a marker all used to
      # move it by accident.
      - name: The search pin only moves when asked
        run: node scripts/seeker-pin-check.mjs http://localhost:3111 /tmp

  # Is the live database ready for what is about to be deployed? Three times
  # this week a deploy went out ahead of its migration and the only warning was
  # the site answering 500. Read-only, and skipped until the secret exists:
  #   gh secret set DATABASE_URL
  deploy-guard:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
        ports: ["5432:5432"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Compare the live schema with this commit's
        env:
          ADMIN_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "No DATABASE_URL secret — nothing to compare against."
            echo "Set one with: gh secret set DATABASE_URL"
            exit 0
          fi
          node scripts/check-live-schema.mjs
